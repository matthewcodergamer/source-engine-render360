name: Render360 Portal iPhone Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - render360/iphone-baseline
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portal-iphone-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build upstream threaded Portal runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Source fork
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify upstream baseline architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f emscripten/build.sh
          grep -q -- '-sSHARED_MEMORY=1' emscripten/build.sh
          grep -q -- '-sUSE_PTHREADS' emscripten/build.sh
          grep -q -- '-sPTHREAD_POOL_SIZE=navigator.hardwareConcurrency' emscripten/build.sh
          grep -q -- '-sPTHREAD_POOL_SIZE_STRICT=0' emscripten/build.sh
          grep -q -- '-sPROXY_TO_PTHREAD' emscripten/build.sh
          grep -q -- '-sOFFSCREENCANVASES_TO_PTHREAD' emscripten/build.sh
          grep -q -- '-sMAIN_MODULE' emscripten/build.sh
          grep -q -- '-sINCLUDE_FULL_LIBRARY=1' emscripten/build.sh
          grep -q -- '-sINITIAL_MEMORY=512mb' emscripten/build.sh
          grep -q -- '-sALLOW_MEMORY_GROWTH=1' emscripten/build.sh
          grep -q -- '-sMAXIMUM_MEMORY=1536mb' emscripten/build.sh
          grep -q -- '-sMEMORY_GROWTH_LINEAR_STEP=64mb' emscripten/build.sh
          grep -q -- '--preload-file' emscripten/build.sh
          grep -q 'EMCC_FORCE_STDLIBS=1' emscripten/build.sh
          if grep -q 'link_libs=' emscripten/build.sh; then
            echo 'Render360 Portal: SIDE_MODULEs were returned to load-time linking; Source requires runtime dlopen.' >&2
            exit 1
          fi
          grep -q 'Atomics.store' emscripten/pre.js
          grep -q 'Do not speculatively load' emscripten/pre.js
          if grep -q 'background preload failed' emscripten/pre.js; then
            echo 'Render360 Portal: speculative next-map preload returned unexpectedly.' >&2
            exit 1
          fi
          grep -q 'Portal JS exception' emscripten/shell.html
          grep -q 'libsourcevr.so' emscripten/build.sh
          grep -q 'libstdshader_dx9.so' emscripten/build.sh
          grep -q 'BOOT_OVERLAY_PATH' emscripten/render360-pages-sw.js
          grep -q 'local-boot' emscripten/render360-pages-sw.js

      - name: Validate dual-source staging JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check emscripten/portal-local-vpk.js
          node --check emscripten/portal-boot-overlay.js
          node --check emscripten/render360-pages-sw.js
          grep -q 'debugluxelsnoalpha.vtf' emscripten/portal-boot-overlay.js
          grep -q 'identitylightwarp.vtf' emscripten/portal-boot-overlay.js
          grep -q 'normalizedrandomdirections2d.vtf' emscripten/portal-boot-overlay.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('emscripten/pages-index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit('no inline staging script found')
          Path('/tmp/render360-pages-inline.js').write_text(inline[-1])
          PY
          node --check /tmp/render360-pages-inline.js

      - name: Install pinned upstream Emscripten environment
        shell: bash
        run: |
          set -euo pipefail
          source emscripten/get_emscripten.sh
          emcc -v
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "$EMSDK" > "$RUNNER_TEMP/render360-emsdk-path.txt"

      - name: Build upstream release
        shell: bash
        run: |
          set -euo pipefail
          source emsdk/emsdk_env.sh
          bash emscripten/build.sh release

      - name: Validate runtime and prepare staging site
        shell: bash
        run: |
          set -euo pipefail

          test -s build/install/hl2_launcher.html
          test -s build/install/hl2_launcher.js
          test -s build/install/hl2_launcher.wasm
          # Runtime dlopen SIDE_MODULEs are packaged into MEMFS by --preload-file.
          test -s build/install/hl2_launcher.data
          grep -a -q 'hl2_launcher.data' build/install/hl2_launcher.js
          grep -a -q 'libengine.so' build/install/hl2_launcher.js
          grep -a -q 'libfilesystem_stdio.so' build/install/hl2_launcher.js
          test -s emscripten/portal-local-vpk.js
          test -s emscripten/portal-boot-overlay.js
          grep -q 'Portal JS exception' build/install/hl2_launcher.html
          grep -q 'chunks/${mapName}.data' emscripten/pre.js

          # Public CI stays runtime-only. The browser fallback generates .data
          # chunks from the tester's own selected Portal/VPK files and stores
          # them only in that browser's Cache Storage. hl2_launcher.data is the
          # generated Emscripten runtime package and is explicitly allowed.
          if find build/install -type f -path '*/chunks/*.data' -print -quit | grep -q .; then
            echo 'Refusing to publish bundled Portal .data chunks.' >&2
            exit 1
          fi

          cp emscripten/pages-index.html build/install/index.html
          cp emscripten/render360-pages-sw.js build/install/render360-pages-sw.js
          cp emscripten/portal-local-vpk.js build/install/portal-local-vpk.js
          cp emscripten/portal-boot-overlay.js build/install/portal-boot-overlay.js

          # background1 becomes available before the remaining chamber chunks
          # finish packing. Do not let the iPhone launch midway through the local
          # VPK build just because the initial chunk probe already succeeds.
          # Also force Safari to update the isolation worker without HTTP cache
          # and give every launcher document navigation a unique URL. This stops
          # an old generated shell/glue/data set from surviving across Pages deploys.
          # The tiny VPK boot overlay is mandatory for launch because the historical
          # upstream background chunk can omit shared Source engine textures.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build/install/index.html')
          text = path.read_text()

          old = '<script src="./portal-local-vpk.js"></script>'
          new = old + '\n<script src="./portal-boot-overlay.js"></script>'
          if old not in text:
              raise SystemExit('Render360 Portal: local VPK script tag changed unexpectedly')
          text = text.replace(old, new, 1)

          old = "const registration=await navigator.serviceWorker.register('./render360-pages-sw.js',{scope:'./'});"
          new = "const registration=await navigator.serviceWorker.register('./render360-pages-sw.js',{scope:'./',updateViaCache:'none'});await registration.update();"
          if old not in text:
              raise SystemExit('Render360 Portal: service-worker registration changed unexpectedly')
          text = text.replace(old, new, 1)

          old = """        $('buildLocal').disabled=!selectedFromFolder;
          await refresh(false);
          if(!lastChunkProbe.ok&&selectedFromFolder)await buildLocalFallback(true);"""
          new = """        $('buildLocal').disabled=!selectedFromFolder;
          $('launch').disabled=true;
          if(selectedFromFolder&&globalThis.Render360PortalBootOverlay){
            try{
              const boot=await Render360PortalBootOverlay.build(selectedPortalFiles,{log});
              log('Local VPK boot overlay complete:',boot);
            }catch(error){
              log('Local VPK boot overlay failed:',error?.stack||String(error));
            }
          }
          await refresh(false);
          if(!lastChunkProbe.ok&&selectedFromFolder)await buildLocalFallback(true);"""
          if old not in text:
              raise SystemExit('Render360 Portal: ownership-success flow changed unexpectedly')
          text = text.replace(old, new, 1)

          old = """    const localReady=await localChunkReady();
          if(localReady)set('localStatus',true,'ready from your VPKs');"""
          new = """    const localReady=await localChunkReady();
          const bootReady=!!globalThis.Render360PortalBootOverlay&&await Render360PortalBootOverlay.hasOverlay();
          if(localReady)set('localStatus',true,'ready from your VPKs');"""
          if old not in text:
              raise SystemExit('Render360 Portal: local readiness block changed unexpectedly')
          text = text.replace(old, new, 1)

          old = 'const ready=threadReady&&runtimeReady&&verified&&chunk.ok;'
          new = 'const ready=threadReady&&runtimeReady&&verified&&chunk.ok&&bootReady&&!buildingLocal;'
          if old not in text:
              raise SystemExit('Render360 Portal: staging launch readiness expression changed unexpectedly')
          text = text.replace(old, new, 1)

          old = """    if(!verified)$('launchHint').textContent='Verify your Portal folder first.';
          else if(!threadReady||!runtimeReady)$('launchHint').textContent='Portal is verified, but the threaded Pages runtime is not ready.';
          else if(chunk.ok&&chunk.source==='local-vpk')"""
          new = """    if(!verified)$('launchHint').textContent='Verify your Portal folder first.';
          else if(!threadReady||!runtimeReady)$('launchHint').textContent='Portal is verified, but the threaded Pages runtime is not ready.';
          else if(!bootReady)$('launchHint').textContent='Choose the full Portal folder once to prepare the shared Source boot textures required before the first frame.';
          else if(chunk.ok&&chunk.source==='local-vpk')"""
          if old not in text:
              raise SystemExit('Render360 Portal: launch hint block changed unexpectedly')
          text = text.replace(old, new, 1)

          old = "$('launch').addEventListener('click',()=>{location.href='./hl2_launcher.html'});"
          new = "$('launch').addEventListener('click',()=>{location.href='./hl2_launcher.html?render360='+Date.now()});"
          if old not in text:
              raise SystemExit('Render360 Portal: launcher navigation changed unexpectedly')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          grep -q 'portal-boot-overlay.js' build/install/index.html
          grep -q 'Render360PortalBootOverlay.build' build/install/index.html
          grep -q 'Render360PortalBootOverlay.hasOverlay' build/install/index.html
          grep -q 'chunk.ok&&bootReady&&!buildingLocal' build/install/index.html
          grep -q "updateViaCache:'none'" build/install/index.html
          grep -q "registration.update()" build/install/index.html
          grep -q "hl2_launcher.html?render360=" build/install/index.html

          touch build/install/.nojekyll

          cat > build/install/render360-baseline.json <<JSON
          {
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "runtimeModel": "pthreads-shared-memory-runtime-dlopen",
            "sideModuleDelivery": "preloaded-memfs",
            "initialMemoryMiB": 512,
            "maximumMemoryMiB": 1536,
            "memoryGrowth": true,
            "bootAssetOverlay": "selected-portal-vpk",
            "diagnostics": true,
            "pagesIsolation": "service-worker-staging-only",
            "runtimeChunkPath": "chunks/<map>.data",
            "chunkSources": ["local-vpk-cache", "original-yikes-host"],
            "bundledPortalRetailData": false
          }
          JSON

          (cd build/install && zip -9 -r "$GITHUB_WORKSPACE/Render360-Portal-iPhone-Baseline.zip" .)
          ls -lh Render360-Portal-iPhone-Baseline.zip

      # Pull-request tokens can be restricted by GitHub and, in this repo,
      # artifact finalization returns HTTP 403 even after all bytes upload.
      # PR runs only need to prove that Source builds and the staging runtime
      # validates. The branch push run is the deployable build, so keep the
      # downloadable artifact and Pages publishing push/workflow_dispatch-only.
      - name: Upload runtime artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Render360-Portal-iPhone-Baseline
          path: Render360-Portal-iPhone-Baseline.zip
          if-no-files-found: error
          retention-days: 7

      - name: PR validation complete
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo 'Portal runtime compiled and validated successfully.'
          echo 'Artifact upload and Pages deployment are intentionally handled by the branch push run.'

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/install

  deploy-pages:
    name: Deploy iPhone staging page
    if: github.event_name != 'pull_request'
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: portal-iphone-staging
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy baseline to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
