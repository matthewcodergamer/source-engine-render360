name: iOS Native Bootstrap IPA

on:
  push:
    branches:
      - render360/ios-native
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-native.yml'
      - 'docs/IOS_NATIVE_**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-native:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Print toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          cmake --version
          clang --version

      - name: Verify no retail Portal data is committed under native project
        shell: bash
        run: |
          set -euo pipefail
          if find ios-native -type f \( \
            -iname '*.vpk' -o -iname '*.bsp' -o -iname '*.vtf' -o -iname '*.vmt' -o \
            -iname '*.vcs' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.mdl' \
          \) -print -quit | grep -q .; then
            echo 'Retail/game asset file detected under ios-native/. Do not package Portal assets in the repository or IPA.' >&2
            exit 1
          fi

      - name: Configure Xcode arm64 iPhone project
        run: |
          set -euxo pipefail
          cmake -S ios-native -B build/ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DRENDER360_DEPLOYMENT_TARGET=15.0 \
            -DRENDER360_BUNDLE_ID=com.render360.portal \
            -DRENDER360_BUILD_IDENTIFIER="${GITHUB_SHA}" \
            -DRENDER360_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      - name: Verify generated iPhoneOS build settings
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project build/ios/Render360PortalIOS.xcodeproj \
            -scheme Render360Portal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -showBuildSettings | tee build/xcode-build-settings.txt

          grep -Eq '^[[:space:]]*ARCHS = arm64$' build/xcode-build-settings.txt
          grep -Eq '^[[:space:]]*SDKROOT = iphoneos([0-9.]+)?$' build/xcode-build-settings.txt
          grep -Eq '^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = 15\.0$' build/xcode-build-settings.txt
          grep -Eq '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = com\.render360\.portal$' build/xcode-build-settings.txt
          grep -Eq '^[[:space:]]*SUPPORTED_PLATFORMS = iphoneos$' build/xcode-build-settings.txt
          grep -Eq '^[[:space:]]*TARGETED_DEVICE_FAMILY = 1$' build/xcode-build-settings.txt
          grep -Eq '^[[:space:]]*SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = NO$' build/xcode-build-settings.txt
          grep -Eq '^[[:space:]]*SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD = NO$' build/xcode-build-settings.txt

      - name: Build unsigned arm64 app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project build/ios/Render360PortalIOS.xcodeproj \
            -scheme Render360Portal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      - name: Verify N0 bundle and package unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail

          resolve_app_path() {
            local candidate
            for candidate in \
              build/ios/Release-iphoneos/Render360Portal.app \
              build/DerivedData/Build/Products/Release-iphoneos/Render360Portal.app; do
              if [ -d "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            find build -type d -path '*/Release-iphoneos/Render360Portal.app' -print -quit 2>/dev/null || true
          }

          APP_PATH="$(resolve_app_path)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo 'Render360 Portal: could not locate the built iPhoneOS .app bundle.' >&2
            find build -maxdepth 6 -type d -name '*.app' -print 2>/dev/null || true
            exit 1
          fi

          EXECUTABLE="$APP_PATH/Render360Portal"
          test -f "$EXECUTABLE"
          file "$EXECUTABLE"
          lipo -archs "$EXECUTABLE" | tee build/architecture.txt
          test "$(cat build/architecture.txt)" = 'arm64'

          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], 'rb') as handle:
              info = plistlib.load(handle)

          assert info.get('CFBundleIdentifier') == 'com.render360.portal', info.get('CFBundleIdentifier')
          assert info.get('CFBundleExecutable') == 'Render360Portal', info.get('CFBundleExecutable')
          assert info.get('LSRequiresIPhoneOS') is True
          assert info.get('UIFileSharingEnabled') is True
          assert info.get('LSSupportsOpeningDocumentsInPlace') is True
          assert info.get('UIStatusBarHidden') is True
          assert info.get('UISupportedInterfaceOrientations') == [
              'UIInterfaceOrientationLandscapeLeft',
              'UIInterfaceOrientationLandscapeRight',
          ]
          assert info.get('UIRequiredDeviceCapabilities') == ['arm64']
          assert info.get('UIDeviceFamily') == [1], info.get('UIDeviceFamily')
          assert info.get('CFBundleSupportedPlatforms') == ['iPhoneOS'], info.get('CFBundleSupportedPlatforms')
          assert info.get('MinimumOSVersion') == '15.0', info.get('MinimumOSVersion')
          assert not any(key.startswith('NS') and key.endswith('UsageDescription') for key in info), 'unexpected privacy usage-description key'
          print('Validated N0 Info.plist metadata')
          PY

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/Render360Portal.app

          cat > build/ipa/BUILD_INFO.txt <<INFO
          Render360 Portal native iOS N0 bootstrap
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          configuration=Release
          sdk=iphoneos
          deployment=15.0
          arch=arm64
          signing=unsigned
          retail_assets=bundled:no
          source_app_path=${APP_PATH}
          INFO

          (cd build/ipa && /usr/bin/zip -qry ../Render360-Portal-iOS-unsigned.ipa Payload BUILD_INFO.txt)
          IPA=build/Render360-Portal-iOS-unsigned.ipa
          test -s "$IPA"
          /usr/bin/unzip -Z1 "$IPA" | tee build/ipa-contents.txt
          grep -qx 'Payload/Render360Portal.app/Render360Portal' build/ipa-contents.txt
          if grep -Eiq '\.(vpk|bsp|vtf|vmt|vcs|wav|mp3|mdl)$' build/ipa-contents.txt; then
            echo 'Retail/game asset extension detected inside IPA.' >&2
            exit 1
          fi
          ls -lh "$IPA"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Render360-Portal-iOS-unsigned-${{ github.run_number }}
          path: |
            build/Render360-Portal-iOS-unsigned.ipa
            build/architecture.txt
            build/xcode-build-settings.txt
            build/ipa-contents.txt
          if-no-files-found: error
          retention-days: 30
