<!DOCTYPE HTML>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Render360 Portal upstream baseline</title>
    <style>{{{ SHELL_CSS }}}</style>
    <style>
      body {
        background: #111;
        color: #fff;
      }

      body #emscripten_logo {
        width: 200px;
      }

      #render360_diagnostics {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0 4px;
      }

      #render360_diagnostics button {
        appearance: none;
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 999px;
        background: rgba(255,255,255,.09);
        color: #fff;
        padding: 7px 12px;
        font: inherit;
      }

      #render360_diagnostic_status {
        color: #aaa;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <a href="http://emscripten.org"><img id="emscripten_logo" src="assets/portal.svg"></a>

    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>

    <span id='controls'>
      <span><input type="button" value="Fullscreen" onclick="render360RequestFullscreen()"></span>
    </span>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>

    <div id="render360_diagnostics">
      <button type="button" onclick="render360CopyDiagnostics()">Copy diagnostics</button>
      <span id="render360_diagnostic_status">Log kept off-screen to save memory</span>
    </div>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var diagnosticStatusElement = document.getElementById('render360_diagnostic_status');

      // Do not mirror Source's very chatty startup log into a textarea/pre.
      // WebKit otherwise owns both the JS string and a second DOM text backing
      // store, and each update can transiently copy the whole log. Keep a small
      // chunked tail only; join it only if the tester taps Copy diagnostics.
      var render360LogChunks = [];
      var render360LogHead = 0;
      var render360LogChars = 0;
      var RENDER360_LOG_MAX_CHARS = 65536;
      // Compatibility marker retained for the existing CI architecture check.
      // The runtime no longer maintains a DOM output element; both names point
      // at the same bounded off-screen diagnostic budget.
      var RENDER360_OUTPUT_MAX_CHARS = RENDER360_LOG_MAX_CHARS;

      function render360AppendOutput(text) {
        var line = String(text) + '\n';
        if (line.length > RENDER360_LOG_MAX_CHARS) line = line.slice(-RENDER360_LOG_MAX_CHARS);
        render360LogChunks.push(line);
        render360LogChars += line.length;

        while (render360LogChars > RENDER360_LOG_MAX_CHARS && render360LogHead < render360LogChunks.length - 1) {
          render360LogChars -= render360LogChunks[render360LogHead].length;
          render360LogChunks[render360LogHead] = '';
          render360LogHead++;
        }
        if (render360LogHead > 256) {
          render360LogChunks = render360LogChunks.slice(render360LogHead);
          render360LogHead = 0;
        }
      }

      function render360DiagnosticText() {
        var log = render360LogChunks.slice(render360LogHead).join('');
        if (log.length > RENDER360_LOG_MAX_CHARS) log = log.slice(-RENDER360_LOG_MAX_CHARS);
        var lines = [
          'Render360 Portal diagnostics',
          'captured=' + new Date().toISOString(),
          'url=' + location.href,
          'status=' + (statusElement ? statusElement.textContent : ''),
          'crossOriginIsolated=' + String(window.crossOriginIsolated === true),
          'SharedArrayBuffer=' + typeof SharedArrayBuffer,
          'OffscreenCanvas=' + typeof OffscreenCanvas,
          'WebGL2=' + String(!!document.createElement('canvas').getContext('webgl2')),
          '',
          '--- buffered runtime log (latest 64 KiB) ---',
          log
        ];
        try {
          var crashState = localStorage.getItem('render360-ios-crash-state-v2');
          if (crashState) lines.splice(8, 0, 'crashState=' + crashState);
          var lastError = localStorage.getItem('render360-ios-last-error-v1');
          if (lastError) lines.splice(9, 0, 'lastError=' + lastError);
        } catch (_) {}
        return lines.join('\n');
      }

      async function render360CopyDiagnostics() {
        var text = render360DiagnosticText();
        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            await navigator.clipboard.writeText(text);
          } else {
            var temporary = document.createElement('textarea');
            temporary.value = text;
            temporary.setAttribute('readonly', '');
            temporary.style.position = 'fixed';
            temporary.style.opacity = '0';
            document.body.appendChild(temporary);
            temporary.select();
            document.execCommand('copy');
            temporary.remove();
          }
          if (diagnosticStatusElement) diagnosticStatusElement.textContent = 'Copied ' + Math.ceil(text.length / 1024) + ' KiB';
          return true;
        } catch (error) {
          if (diagnosticStatusElement) diagnosticStatusElement.textContent = 'Copy failed: ' + String(error && error.message ? error.message : error);
          return false;
        }
      }

      function render360Report(kind, message, error) {
        var stack = error && error.stack ? '\n' + error.stack : '';
        var concise = '[Render360 ' + kind + '] ' + String(message || '<no message>');
        var detail = concise + stack;
        console.error(detail);
        render360AppendOutput(detail);
        if (statusElement) statusElement.textContent = concise;
        try {
          localStorage.setItem('render360-ios-last-error-v1', JSON.stringify({
            at: Date.now(),
            kind: String(kind || 'error'),
            message: String(message || '<no message>').slice(-4096),
            stack: stack.slice(-8192)
          }));
        } catch (_) {}
        return detail;
      }

      async function render360RequestFullscreen() {
        try {
          var target = canvasElement;
          var request = target.requestFullscreen || target.webkitRequestFullscreen;
          if (typeof request !== 'function') {
            render360AppendOutput('[Render360 fullscreen] Element fullscreen is unavailable on this Safari build; continuing inline.');
            return false;
          }
          var result = request.call(target);
          if (result && typeof result.then === 'function') await result;
          return true;
        } catch (error) {
          render360Report('fullscreen failure', error && error.message ? error.message : String(error), error);
          return false;
        }
      }

      canvasElement.addEventListener('webglcontextlost', (e) => {
        render360Report('WebGL context lost', e.statusMessage || 'context lost');
        e.preventDefault();
      }, false);
      canvasElement.addEventListener('webglcontextrestored', () => {
        render360AppendOutput('[Render360 WebGL context restored]');
      }, false);

      canvasElement.widthNative = screen.availWidth;
      canvasElement.heightNative = screen.availHeight;

      var Module = {
        print(...args) {
          render360AppendOutput(args.join(' '));
        },
        printErr(...args) {
          render360AppendOutput('[stderr] ' + args.join(' '));
        },
        canvas: canvasElement,
        setStatus(text) {
          Module.setStatus.last ??= { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2]) * 100;
            progressElement.max = parseInt(m[4]) * 100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.style.display = 'none';
          }
          statusElement.textContent = text;
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');

      window.onerror = (message, source, lineno, colno, error) => {
        render360Report(
          'Portal JS exception',
          String(message) + ' @ ' + String(source || '<unknown>') + ':' + String(lineno || 0) + ':' + String(colno || 0),
          error
        );
        spinnerElement.style.display = 'none';
        return false;
      };

      window.addEventListener('unhandledrejection', (event) => {
        var reason = event.reason;
        render360Report(
          'Portal unhandled rejection',
          reason && reason.message ? reason.message : String(reason),
          reason
        );
      });

      render360AppendOutput('[Render360 baseline] crossOriginIsolated=' + String(window.crossOriginIsolated) +
        ' SharedArrayBuffer=' + typeof SharedArrayBuffer +
        ' OffscreenCanvas=' + typeof OffscreenCanvas);
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
