<!DOCTYPE HTML>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Render360 Portal upstream baseline</title>
    <style>{{{ SHELL_CSS }}}</style>
	<style>
		body {
			background: #111;
			color: #fff;
		}

		body #emscripten_logo {
			width: 200px;
		}
	</style>
  </head>
  <body>
    <a href="http://emscripten.org"><img id="emscripten_logo" src="assets/portal.svg"></a>

    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>

    <span id='controls'>
      <span><input type="button" value="Fullscreen" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked,
                                                                                document.getElementById('resize').checked)">
      </span>
    </span>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <textarea id="output" rows="8"></textarea>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = ''; // clear browser cache

      function render360Report(kind, message, error) {
        var stack = error && error.stack ? '\n' + error.stack : '';
        var detail = '[Render360 ' + kind + '] ' + String(message || '<no message>') + stack;
        console.error(detail);
        if (outputElement) {
          outputElement.value += detail + '\n';
          outputElement.scrollTop = outputElement.scrollHeight;
        }
        if (statusElement) statusElement.textContent = detail;
        return detail;
      }

      // Keep the context recoverable, but expose the actual WebGL lifecycle instead
      // of stopping at an alert on iPhone Safari.
      canvasElement.addEventListener('webglcontextlost', (e) => {
        render360Report('WebGL context lost', e.statusMessage || 'context lost');
        e.preventDefault();
      }, false);
      canvasElement.addEventListener('webglcontextrestored', () => {
        console.warn('[Render360 WebGL context restored]');
        if (outputElement) outputElement.value += '[Render360 WebGL context restored]\n';
      }, false);

	  canvasElement.widthNative = screen.availWidth
	  canvasElement.heightNative = screen.availHeight

      var Module = {
        print(...args) {
          console.log(...args);
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        printErr(...args) {
          console.error(...args);
          if (outputElement) {
            var text = '[stderr] ' + args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        canvas: canvasElement,
        setStatus(text) {
          Module.setStatus.last ??= { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.style.display = 'none';
          }
          statusElement.textContent = text;
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');

      window.onerror = (message, source, lineno, colno, error) => {
        render360Report(
          'Portal JS exception',
          String(message) + ' @ ' + String(source || '<unknown>') + ':' + String(lineno || 0) + ':' + String(colno || 0),
          error
        );
        spinnerElement.style.display = 'none';
        return false;
      };

      window.addEventListener('unhandledrejection', (event) => {
        var reason = event.reason;
        render360Report(
          'Portal unhandled rejection',
          reason && reason.message ? reason.message : String(reason),
          reason
        );
      });

      console.log('[Render360 baseline] crossOriginIsolated=', window.crossOriginIsolated,
        'SharedArrayBuffer=', typeof SharedArrayBuffer,
        'OffscreenCanvas=', typeof OffscreenCanvas);
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
